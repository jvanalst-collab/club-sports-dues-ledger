<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Club Soccer Dues Ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}code{background:var(--sunk);padding:1px 5px;border-radius:3px}
/* Layout: a ledger. Summary strip on top, tabbed working area below, one wide money table as the centerpiece. */
:root{
  --bg:#f2f5f0; --surface:#ffffff; --sunk:#e8ede6; --fg:#15211a; --muted:#5a6a60; --line:#d3dcd3;
  --accent:#0a6a43; --accent-fg:#ffffff; --mark:#f4d21f; --mark-fg:#2a2400;
  --good:#1a7a4b; --warn:#a65f00; --bad:#b0362a;
  --good-bg:#dff1e6; --warn-bg:#fbeccd; --bad-bg:#f8dfdb;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c-other:#a3aaa5;
  --t1:#104281; --t2:#256abf; --t3:#5598e7; --t4:#86b6ef;
  --s-none:#b9c2bb; --s-prog:#2f7fc1; --s-stuck:#d8432b; --s-done:#1f8a4c; --today:#d9a400; --gold:#fee123;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#161f1a; --sunk:#1d2822; --fg:#e7eee8; --muted:#93a399; --line:#2b3931;
  --accent:#4cc489; --accent-fg:#06180f; --mark:#f4d21f; --mark-fg:#2a2400;
  --good:#5fd09a; --warn:#e6ab4c; --bad:#f08576;
  --good-bg:#16352a; --warn-bg:#3a2c12; --bad-bg:#3f1f1b;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c-other:#6b766f;
  --t1:#184f95; --t2:#2a78d6; --t3:#6da7ec; --t4:#b7d3f6;
  --s-none:#5a665d; --s-prog:#5aa0dc; --s-stuck:#ef6a52; --s-done:#3dbb74; --today:#f0c43a; --gold:#f2d94a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#161f1a; --sunk:#1d2822; --fg:#e7eee8; --muted:#93a399; --line:#2b3931;
  --accent:#4cc489; --accent-fg:#06180f; --mark:#f4d21f; --mark-fg:#2a2400;
  --good:#5fd09a; --warn:#e6ab4c; --bad:#f08576;
  --good-bg:#16352a; --warn-bg:#3a2c12; --bad-bg:#3f1f1b;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c-other:#6b766f;
  --t1:#184f95; --t2:#2a78d6; --t3:#6da7ec; --t4:#b7d3f6;
  --s-none:#5a665d; --s-prog:#5aa0dc; --s-stuck:#ef6a52; --s-done:#3dbb74; --today:#f0c43a; --gold:#f2d94a; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 72px;display:flex;flex-direction:column;gap:18px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:34px;line-height:1;text-transform:uppercase}
h2{font-size:22px;text-transform:uppercase}
h3{font-size:18px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:3px solid var(--accent);padding-bottom:12px}
header.top .name{display:flex;flex-direction:column;gap:4px}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.status[data-s="saving"]::before{background:var(--mark)}
.status[data-s="off"]::before{background:var(--bad)}

.banner{background:var(--warn-bg);color:var(--fg);border-left:4px solid var(--warn);padding:10px 12px;border-radius:var(--r);font-size:14px}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .v{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05}
.tile.key{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tile.key .eyebrow,.tile.key .muted{color:var(--accent-fg);opacity:.85}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile .v{font-size:26px}}

nav.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav.tabs button{font:600 15px var(--body);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--mark)}
nav.tabs button:hover{color:var(--fg)}

.panel{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row.between{justify-content:space-between;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.grow{flex:1 1 180px}
input[type=text],input[type=password],input[type=date],select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0;width:100%}
textarea{min-height:120px;resize:vertical}
input.money{width:120px;text-align:right;font-variant-numeric:tabular-nums}
input.bare{background:transparent;border-color:transparent;padding-inline:6px}
input.bare:hover{border-color:var(--line)}
input.bare:focus{background:var(--bg);border-color:var(--line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:600 14px var(--body);border-radius:var(--r);padding:8px 12px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button.link{border:0;background:none;padding:2px 4px;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
button.danger{color:var(--bad)}
button.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
button:disabled{opacity:.5;cursor:default}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sunk);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:2px solid var(--fg);border-bottom:0}
tr.detail td{background:var(--sunk);white-space:normal;text-align:left;padding:12px 14px}
.pname{font-weight:600;background:none;border:0;padding:0;color:var(--fg);cursor:pointer;font-size:14px;text-align:left}
.pname::before{content:"▸";display:inline-block;width:14px;color:var(--muted)}
.pname[aria-expanded="true"]::before{content:"▾"}
.bal{font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
.pill.owes{background:var(--warn-bg);color:var(--warn)}
.pill.paid{background:var(--good-bg);color:var(--good)}
.pill.credit{background:var(--sunk);color:var(--muted)}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tag.ps{color:var(--mark-fg);background:var(--mark);padding:1px 6px;border-radius:3px}

.lines{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;max-width:460px}
.lines .tot{border-top:1px solid var(--line);padding-top:4px;font-weight:600}
.detailgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.detailgrid>div{display:flex;flex-direction:column;gap:8px;min-width:0}

.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 12px}
.checks label{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:var(--r);cursor:pointer;min-width:0}
.checks label:hover{background:var(--sunk)}
.checks label span{overflow-wrap:anywhere}
.checks input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.field>span.share{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:0;text-transform:none;color:var(--fg);line-height:1.5}

.explines{display:flex;flex-direction:column;gap:6px;max-width:540px}
.expline{display:grid;grid-template-columns:minmax(0,1fr) 110px auto auto;gap:6px;align-items:center}
.field>span.small{text-transform:none;letter-spacing:0;font-weight:400;font-size:12px}
.expline .per{order:2;font-size:12px;color:var(--muted);white-space:nowrap;min-width:92px}
.expline .feechk{order:3}.expline button.danger{order:4}
.expline:has(.per){grid-template-columns:minmax(0,1fr) 110px auto auto auto}
@media (max-width:560px){.expline:has(.per){grid-template-columns:minmax(0,1fr) 96px auto auto}.expline .per{grid-column:1 / -1;order:5;min-width:0;margin-top:-2px}}
.feechk{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;padding:0 4px}
.feechk input{width:15px;height:15px;accent-color:var(--accent)}
.expline.isfee input.money{color:var(--muted);text-decoration:line-through}
.feelist{display:flex;flex-direction:column;gap:2px;font-size:13px;max-width:540px}
.feelist div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-block:3px}
.expline input.money{width:100%}
.chips{display:flex;gap:4px;flex-wrap:wrap;min-width:180px}
.chip{padding:3px 10px;border-radius:99px;font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.costblock{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px}
.empty ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:62ch}
.warnlist{display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;bottom:0;transform:translateX(-50%);margin-bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:var(--r);font-size:14px;max-width:calc(100% - 32px)}
table.ledger th.grp{background:var(--surface);border-bottom:0;padding-block:6px 0;color:var(--accent)}
table.ledger th.grp.l{border-bottom:2px solid var(--accent)}
td.bal.neg{color:var(--bad)}
input.ldate{width:132px;padding:4px 6px;background:transparent;border-color:transparent;font-variant-numeric:tabular-nums}
input.ldate:hover{border-color:var(--line)}input.ldate:focus{background:var(--bg);border-color:var(--line)}
input.ldate.nodate{color:var(--muted)}
tr.flash td{animation:lflash 1.6s ease-out}
@keyframes lflash{0%,30%{background:var(--good-bg)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){tr.flash td{animation:none;background:var(--good-bg)}}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
@media (max-width:760px){.bgrid{grid-template-columns:minmax(0,1fr)}}
.bpanel{display:flex;flex-direction:column;gap:10px;min-width:0}
.bchart{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.donutwrap{position:relative;width:180px;max-width:100%;flex:none}
.donut{width:100%;height:auto;display:block}
.donut path{transition:opacity .15s}
.dcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 46px}
.dval{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1}
.dlbl{font-size:11px;color:var(--muted);line-height:1.2;margin-top:2px;overflow-wrap:anywhere}
.blegend{flex:1 1 200px;min-width:0;width:auto;font-size:13px}
.blegend td{padding:4px 6px;border-bottom:1px solid var(--line);white-space:normal}
.blegend tr{cursor:default}
.blegend tr.bsub td{font-size:12px;color:var(--muted);padding-block:2px}
.blegend tr.bsub td:first-child{padding-left:24px}
.blegend tr.bsub td.num:not(.muted){color:var(--fg)}
.blegend tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
[data-bseg].dim{opacity:.35}
.meter{display:flex;flex-direction:column;gap:6px}
.mtrack{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.mfill{height:100%;border-radius:5px;background:var(--accent)}
.mfill.over{background:var(--bad)}
@media (prefers-reduced-motion:reduce){.donut path{transition:none}}
.np-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.np-tile{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.np-tile b{font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.np-tile span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.np-tile.none{border-left-color:var(--s-none)}.np-tile.prog{border-left-color:var(--s-prog)}.np-tile.stuck{border-left-color:var(--s-stuck)}.np-tile.done{border-left-color:var(--s-done)}
.np-gantt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.g-inner{min-width:760px}
.g-row{display:grid;grid-template-columns:230px 1fr;align-items:center;border-top:1px solid var(--line);min-height:34px}
.g-row.head{border-top:0;background:var(--sunk)}
.g-label{padding:6px 12px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.g-label small{display:block;color:var(--muted);font-size:11px}
.g-track{position:relative;height:34px;border-left:1px solid var(--line)}
.g-days{position:relative;height:40px;border-left:1px solid var(--line)}
.g-day{position:absolute;top:0;height:100%;font-size:11px;color:var(--muted);border-left:1px solid var(--line);padding:4px 0 0 4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.g-day.wk{color:var(--fg);font-weight:600}
.g-bar{position:absolute;top:8px;height:18px;border-radius:3px;background:var(--s-none);color:#fff;font-size:11px;line-height:18px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:8px}
.g-bar.prog{background:var(--s-prog)}.g-bar.stuck{background:var(--s-stuck)}.g-bar.done{background:var(--s-done);opacity:.75}.g-bar.none{color:var(--fg)}
.g-dl{position:absolute;top:4px;width:0;height:26px;border-left:2px solid var(--fg);opacity:.55}
.g-today{position:absolute;top:0;bottom:0;border-left:2px solid var(--today);z-index:2}
.g-days .g-today::after{content:"today";position:absolute;top:22px;left:4px;font-size:10px;color:var(--today);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.g-event{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--gold) 26%,transparent)}
.g-nodate{font-size:12px;color:var(--muted);padding:9px 10px;font-style:italic}
.np-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.np-legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.np-phase{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.np-ph{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:10px 14px;background:var(--sunk);border-bottom:1px solid var(--line)}
.np-ph h3{font-size:17px}.np-ph .due{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
table.np-tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}
.np-tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;background:var(--surface);position:static}
.np-tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;white-space:normal}
.np-tbl tr:last-child td{border-bottom:0}
.np-tbl tr.done td.task{color:var(--muted)}.np-tbl tr.done .t-title{text-decoration:line-through}
.t-title{font-weight:600}.t-desc{font-size:12px;color:var(--muted);margin-top:2px}.t-desc a{color:var(--accent)}
.np-tbl th.c-own{width:150px}.np-tbl th.c-dl{width:150px}.np-tbl th.c-st{width:140px}.np-tbl th.c-note{width:220px}
.np-tbl input,.np-tbl select,.np-tbl textarea{font-size:13px;padding:5px 7px}
.np-tbl textarea{resize:vertical;min-height:34px;height:34px}
select.st{font-weight:600;border-left-width:5px}
select.st.none{border-left-color:var(--s-none)}select.st.prog{border-left-color:var(--s-prog)}select.st.stuck{border-left-color:var(--s-stuck)}select.st.done{border-left-color:var(--s-done)}
.dl-note{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
.dl-note.late{color:var(--bad);font-weight:600}
.np-links{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center;margin-top:6px;font-size:13px}
.np-link{font-weight:600;color:var(--accent);text-underline-offset:2px}
.np-links button.link.small{font-size:12px;padding:1px 2px}
.np-mail{user-select:all;font-variant-numeric:tabular-nums}
.np-edit{display:flex;flex-direction:column;gap:8px;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk)}
.np-add{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.np-add input{flex:1 1 220px}
.np-ref{font-size:13px;color:var(--muted)}.np-ref ul{padding-left:18px;margin:6px 0}.np-ref li{margin:4px 0}.np-ref strong{color:var(--fg)}
@media (max-width:720px){
  table.np-tbl,.np-tbl thead,.np-tbl tbody,.np-tbl tr,.np-tbl td{display:block;width:auto}
  .np-tbl thead{display:none}
  .np-tbl tr{border-bottom:1px solid var(--line);padding:8px 10px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 10px}
  .np-tbl td{border:0;padding:0}
  .np-tbl td.task,.np-tbl td.c-note{grid-column:1 / -1}
  .np-tbl td::before{content:attr(data-l);display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:2px;font-weight:600}
  .np-tbl td.task::before{display:none}
}
@media (prefers-reduced-motion:no-preference){.g-bar{transition:width .2s,left .2s,background-color .2s}}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="name">
      <span class="eyebrow">UO Men's Club Soccer</span>
      <h1>Dues Ledger</h1>
    </div>
    <div class="row" style="align-items:center"><div class="status" id="status" data-s="saving">Connecting…</div><button id="lockbtn" data-act="lock" hidden>Lock</button></div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div id="tiles" class="tiles"></div>
  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-act="tab" data-tab="balances">Balances</button>
    <button role="tab" data-act="tab" data-tab="trips">Trips</button>
    <button role="tab" data-act="tab" data-tab="roster">Roster</button>
    <button role="tab" data-act="tab" data-tab="costs">Costs &amp; fundraising</button>
    <button role="tab" data-act="tab" data-tab="usccs">USCCS costs</button>
    <button role="tab" data-act="tab" data-tab="payments">Payments</button>
    <button role="tab" data-act="tab" data-tab="ledger">Ledger</button>
    <button role="tab" data-act="tab" data-tab="nationals">Nationals prep</button>
  </nav>
  <div id="view" class="panel"></div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>
/*CALC-START*/
const sumLines=a=>(a||[]).reduce((t,l)=>t+(l.fee?0:Math.max(0,+l.amount||0)),0);
const feeLines=a=>(a||[]).reduce((t,l)=>t+(l.fee?Math.max(0,+l.amount||0):0),0);
const tripCost=t=>Array.isArray(t.expenses)?sumLines(t.expenses):Math.max(0,+t.cost||0);
const fixedAmt=it=>Array.isArray(it.lines)?sumLines(it.lines):Math.max(0,+it.amount||0);
function compute(players, trips, payments, cfg){
  const list=[...players].map(([id,p])=>({id,name:p.name||'',squad:p.squad==='practice'?'practice':'travel',qualified:!!p.fundQualified,ownFund:!!p.ownFund,ownAmt:Math.max(0,+p.ownAmt||0),skipped:[],items:[],fixed:0,travel:0,tripCount:0,credit:0,paid:0}));
  const rows=new Map(list.map(r=>[r.id,r]));
  const tsq=list.filter(r=>r.squad==='travel'), n=tsq.length, warnings=[];
  (cfg.fixed||[]).forEach(it=>{
    const amt=fixedAmt(it); if(!amt) return;
    const skip=new Set(it.skip||[]),payers=tsq.filter(r=>!skip.has(r.id));
    tsq.forEach(r=>{if(skip.has(r.id))r.skipped.push(it.name||'Squad cost');});
    if(!payers.length){warnings.push(`"${it.name||'Squad cost'}" has no travel squad players to bill.`);return;}
    const each=it.basis==='each'?amt:amt/payers.length;
    payers.forEach(r=>{r.fixed+=each;r.items.push({label:it.name||'Squad cost',amount:each});});
  });
  const tripInfo=new Map();
  [...trips].forEach(([id,t])=>{
    const goers=[...new Set(t.travelers||[])].map(x=>rows.get(x)).filter(Boolean);
    const cost=tripCost(t), share=goers.length?cost/goers.length:0;
    tripInfo.set(id,{count:goers.length,share,cost});
    if(cost>0&&!goers.length) warnings.push(`"${t.name||'Untitled trip'}" has a cost but no travelers checked, so nobody is billed for it.`);
    goers.forEach(r=>{r.travel+=share;r.tripCount++;r.items.push({label:'Travel: '+(t.name||'Untitled trip'),amount:share});});
  });
  list.forEach(r=>r.gross=r.fixed+r.travel);
  let orphanPaid=0;
  [...payments].forEach(([id,p])=>{const r=rows.get(p.playerId),a=+p.amount||0; if(r) r.paid+=a; else orphanPaid+=a;});
  const F=Math.max(0,+cfg.fundraising||0);
  const own=list.filter(r=>r.ownFund),ownTotal=own.reduce((t,r)=>t+r.ownAmt,0),P=Math.max(0,F-ownTotal);
  own.forEach(r=>{r.credit=Math.min(r.gross,r.ownAmt);r.ownUnused=r.ownAmt-r.credit;});
  const qMode=cfg.fundMode==='qualified', psq=list.filter(r=>r.squad==='practice'&&r.qualified), elig=[...(qMode?tsq.filter(r=>r.qualified):tsq),...psq].filter(r=>!r.ownFund), ne=elig.length, nPrac=psq.filter(r=>!r.ownFund).length;
  if(ne){
    if(cfg.rollover){
      const cap=r=>Math.max(0,r.gross-r.paid);let rem=P; const s=[...elig].sort((a,b)=>cap(a)-cap(b));
      s.forEach((r,i)=>{const level=rem/(ne-i); r.credit=Math.min(cap(r),level); rem-=r.credit;});
    } else elig.forEach(r=>r.credit=Math.min(r.gross,P/ne));
  }
  const tot={gross:0,fixed:0,travel:0,credit:0,net:0,paid:0,owed:0,over:0};
  list.forEach(r=>{r.net=r.gross-r.credit;r.balance=r.net-r.paid;
    tot.gross+=r.gross;tot.fixed+=r.fixed;tot.travel+=r.travel;tot.credit+=r.credit;tot.net+=r.net;tot.paid+=r.paid;
    if(r.balance>0)tot.owed+=r.balance;else tot.over-=r.balance;});
  const poolUsed=elig.reduce((t,r)=>t+r.credit,0),unused=P-poolUsed;
  if(ownTotal>F+0.005) warnings.push(`Personal fundraising entered for individual players (${fmt(ownTotal)}) is more than the total raised (${fmt(F)}). Check the total on the Costs & fundraising tab.`);
  own.filter(r=>r.ownUnused>0.005).forEach(r=>warnings.push(`${r.name} raised ${fmt(r.ownAmt)} for his own dues, which is ${fmt(r.ownUnused)} more than he owes. The extra stays his and is not shared.`));
  if(unused>0.005) warnings.push(ne?`${fmt(unused)} of fundraising is not applied, because some players' dues are smaller than their credit.`:qMode?`Fundraising is set to qualified players only, and no travel squad players are checked, so none of it is applied.`:`Fundraising has no travel squad players to apply to.`);
  if(!cfg.rollover){const od=elig.filter(r=>r.credit>0.005&&r.gross-r.credit-r.paid<-0.005);
    if(od.length)warnings.push(`${od.map(r=>r.name).join(', ')} ${od.length===1?'has':'have'} paid more than ${od.length===1?'his':'their'} dues after fundraising credit, so ${od.length===1?'he is':'they are'} owed a refund. To give that credit to players who still owe instead, turn on "pass the extra" on the Costs & fundraising tab.`);}
  if(orphanPaid>0.005) warnings.push(`${fmt(orphanPaid)} in payments belongs to players no longer on the roster.`);
  list.sort((a,b)=>a.name.localeCompare(b.name));
  return {list,rows,tot,tripInfo,warnings,nTravel:n,nElig:ne,qMode,perCredit:ne?P/ne:0,unused,F,P,ownTotal,nOwn:own.length,nPrac};
}
function fmt(n){n=Math.round((+n||0)*100)/100; if(Object.is(n,-0))n=0; const s=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); return (n<0?'−$':'$')+s;}
/*CALC-END*/

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const money=v=>{const n=parseFloat(String(v).replace(/[$,\s]/g,''));return isFinite(n)&&n>0?Math.round(n*100)/100:0;};
const mval=n=>(+n?(+n).toFixed(2):'');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const COLS=['players','trips','payments','config'];
const local={players:new Map(),trips:new Map(),payments:new Map(),config:new Map()};
const loaded={};
const wr=new Map();
const S={phase:'connecting',code:'',rev:-1,writeSeq:0,offline:false,lockMsg:'',tab:'balances',open:{},filter:'all',armed:null};
const DEFAULT_CFG={fixed:[{id:'gear',name:'Gear',basis:'split',lines:[{id:'g1',label:'Gear order',amount:0}]},{id:'coach',name:"Coach's pay",basis:'split',lines:[{id:'c1',label:"Coach's pay",amount:0}]}],fundraising:0,rollover:false};
const USCCS={id:'usccs',group:'usccs',name:'USCCS league costs',basis:'split',lines:[{id:'bond',label:'Performance bond',amount:0},{id:'ref',label:'Referee fees',amount:0},{id:'assign',label:'Referee assigning fees',amount:0},{id:'fines',label:'Cancellation fees and fines',amount:0},{id:'natapp',label:'Nationals application fee',amount:0},{id:'reg',label:'Player/coach registration',amount:0}]};
const cfg=()=>{const c=local.config.get('main')||DEFAULT_CFG;return (c.fixed||[]).some(i=>i.id==='usccs')?c:{...c,fixed:[...(c.fixed||[]),USCCS]};};
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- saving ---------- */
const CFG=window.LEDGER_CONFIG||{};
let sb=null,polling=false;
function put(col,id,body,delay=300){local[col].set(id,body);sched(col,id,false,delay);render();}
function del(col,id){local[col].delete(id);sched(col,id,true,0);render();}
function sched(col,id,isDel,delay){
  const k=col+'/'+id;let w=wr.get(k);if(!w){w={col,id};wr.set(k,w);}
  w.del=isDel;w.dirty=true;clearTimeout(w.timer);w.timer=setTimeout(()=>flush(k),delay);setStatus();
}
const isBad=e=>/bad_passcode/.test((e&&e.message)||'');
async function flush(k){
  const w=wr.get(k);if(!w||w.busy||!w.dirty)return;
  if(S.phase!=='live'){wr.delete(k);setStatus();return;}
  w.busy=true;w.dirty=false;
  try{
    const body=local[w.col].get(w.id);
    const res=(w.del||!body)?await sb.rpc('ledger_del',{p_code:S.code,p_col:w.col,p_id:w.id}):await sb.rpc('ledger_put',{p_code:S.code,p_col:w.col,p_id:w.id,p_body:clone(body)});
    if(res.error) throw res.error;
    S.failed=false;
  }catch(e){
    if(isBad(e)){w.busy=false;wr.clear();lock('The passcode was changed. Enter the new one.');return;}
    S.failed=true;toast('That change did not save. Check your connection and make it again.');
  }
  S.writeSeq++;w.busy=false;
  if(w.dirty) flush(k); else wr.delete(k);
  setStatus();
  if(!wr.size) poll(true);
}
function setStatus(){
  const el=$('status'),lk=$('lockbtn');lk.hidden=S.phase!=='live';
  if(S.phase==='connecting'){el.dataset.s='saving';el.textContent='Connecting…';}
  else if(S.phase!=='live'){el.dataset.s='off';el.textContent=S.phase==='setup'?'Not set up':'Locked';}
  else if(S.offline){el.dataset.s='off';el.textContent='Offline, retrying…';}
  else if(wr.size){el.dataset.s='saving';el.textContent='Saving…';}
  else{el.dataset.s='ok';el.textContent='All changes saved';}
}
function showBanner(t){const b=$('banner');b.textContent=t;b.hidden=false;}
let toastT;function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,4000);}

/* ---------- connection ---------- */
function apply(data){
  const next={players:new Map(),trips:new Map(),payments:new Map(),config:new Map()};
  (data.docs||[]).forEach(d=>{if(next[d.col])next[d.col].set(d.id,d.body||{});});
  for(const w of wr.values()){if(w.del)next[w.col].delete(w.id);else if(local[w.col].has(w.id))next[w.col].set(w.id,local[w.col].get(w.id));}
  COLS.forEach(c=>local[c]=next[c]);S.rev=data.rev;render();
}
function lock(msg){
  S.phase='locked';S.code='';S.lockMsg=msg||'';S.rev=-1;COLS.forEach(c=>local[c]=new Map());
  try{localStorage.removeItem('ledger_code');}catch(e){}
  setStatus();render();
}
async function unlock(code){
  S.phase='connecting';setStatus();render();
  let res;try{res=await sb.rpc('ledger_get',{p_code:code,p_rev:-1});}catch(e){res={error:e};}
  if(res.error||!res.data){
    if(isBad(res.error)) return lock('That passcode is not right.');
    S.phase='locked';S.lockMsg='Could not reach the ledger. Check your connection and try again.';setStatus();render();return;
  }
  S.code=code;try{localStorage.setItem('ledger_code',code);}catch(e){}
  S.phase='live';apply(res.data);setStatus();
}
async function poll(force){
  if(S.phase!=='live'||polling||(document.hidden&&!force))return;
  polling=true;const seq=S.writeSeq;let res;
  try{res=await sb.rpc('ledger_get',{p_code:S.code,p_rev:S.rev});}catch(e){res={error:e};}
  polling=false;
  if(S.phase!=='live')return;
  if(res.error||!res.data){if(isBad(res.error))return lock('The passcode was changed. Enter the new one.');S.offline=true;setStatus();return;}
  S.offline=false;
  if(seq!==S.writeSeq||[...wr.values()].some(w=>w.busy))return poll(true);
  if(!res.data.unchanged)apply(res.data);
  setStatus();
}
function boot(){
  if(!CFG.url||!CFG.key||!window.supabase){S.phase='setup';setStatus();render();return;}
  sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:false,autoRefreshToken:false}});
  setInterval(()=>poll(),4000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll();});
  let code='';try{code=localStorage.getItem('ledger_code')||'';}catch(e){}
  if(code)unlock(code);else{S.phase='locked';setStatus();render();}
}

/* ---------- render ---------- */
let raf=0;function render(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;paint();});}
function paint(){
  const view=$('view'),ae=document.activeElement;
  const keep=ae&&ae.id&&view.contains(ae)?{id:ae.id,v:ae.value,s:ae.selectionStart,e:ae.selectionEnd,text:ae.matches('input[type=text],input[type=password],input[type=date],textarea')}:null;
  const drafts={};view.querySelectorAll('[data-draft]').forEach(el=>drafts[el.id]=el.value);
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  $('tabs').hidden=S.phase!=='live';
  if(S.phase!=='live'){$('tiles').innerHTML='';
    view.innerHTML=S.phase==='connecting'?'<div class="empty"><span class="muted">Loading the saved ledger…</span></div>'
    :S.phase==='setup'?'<div class="empty"><h2>Not connected yet</h2><span>Add your Supabase project URL and anon key to <code>config.js</code>, then redeploy. The README has the steps.</span></div>'
    :`<form class="empty" id="lockform" style="max-width:420px"><h2>Enter the passcode</h2><span class="muted">The coach or a captain can give it to you. This device remembers it after the first time.</span>
      ${S.lockMsg?`<div class="banner">${esc(S.lockMsg)}</div>`:''}
      <label class="field"><span>Passcode</span><input type="password" id="lockcode" autocomplete="current-password" data-draft></label>
      <div><button class="primary" type="submit">Open the ledger</button></div></form>`;
    if(S.phase==='locked'&&!keep){const el=$('lockcode');if(el)el.focus();}
    else if(keep){const el=$(keep.id);if(el){el.value=keep.v;el.focus();}}
    return;}
  const C=compute(local.players,local.trips,local.payments,cfg());
  $('tiles').innerHTML=tiles(C);
  view.innerHTML=({balances:vBalances,trips:vTrips,roster:vRoster,costs:vCosts,usccs:vUsccs,payments:vPayments,ledger:vLedger,nationals:vNationals}[S.tab]||vBalances)(C);
  for(const id in drafts){const el=$(id);if(el&&drafts[id]!=='')el.value=drafts[id];}
  if(keep){const el=$(keep.id);if(el){if(keep.text)el.value=keep.v;el.focus({preventScroll:true});try{if(keep.text)el.setSelectionRange(keep.s,keep.e);}catch(e){}}}
  if(S.lflash){const tr=view.querySelector(`tr[data-row="${CSS.escape(S.lflash)}"]`);S.lflash=null;if(tr){tr.classList.add('flash');try{tr.scrollIntoView({block:'nearest'});}catch(e){}}}
}
function tiles(C){
  const t=C.tot;
  return `<div class="tile"><span class="eyebrow">Total dues billed</span><span class="v num">${fmt(t.gross)}</span><span class="small muted">${C.list.length} players</span></div>
  <div class="tile"><span class="eyebrow">Fundraising applied</span><span class="v num">${fmt(t.credit)}</span><span class="small muted">of ${fmt(C.F)} raised</span></div>
  <div class="tile"><span class="eyebrow">Collected</span><span class="v num">${fmt(t.paid)}</span><span class="small muted">${local.payments.size} payments logged</span></div>
  <div class="tile key"><span class="eyebrow">Still owed</span><span class="v num">${fmt(t.owed)}</span><span class="small muted">${C.list.filter(r=>r.balance>0.005).length} players owe</span></div>`;
}
function warns(C){return C.warnings.length?`<div class="warnlist">${C.warnings.map(w=>`<div class="banner">${esc(w)}</div>`).join('')}</div>`:'';}
function pill(r){return r.balance>0.005?'<span class="pill owes">Owes</span>':r.balance<-0.005?'<span class="pill credit">Overpaid</span>':'<span class="pill paid">'+(r.net>0.005?'Paid up':'Nothing due')+'</span>';}
function squadTag(s){return s==='practice'?'<span class="tag ps">Practice</span>':'<span class="tag">Travel</span>';}
function playerOpts(sel){return [...local.players].map(([id,p])=>({id,name:p.name||''})).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${esc(p.id)}"${p.id===sel?' selected':''}>${esc(p.name)}</option>`).join('');}
function armBtn(key,label,act,attrs){return S.armed===key?`<button class="danger armed" data-act="${act}" ${attrs}>Confirm</button> <button data-act="disarm">Cancel</button>`:`<button class="danger" data-act="arm" data-key="${esc(key)}">${label}</button>`;}

function linesHtml(kind,pid,lines,per){return `<div class="explines"><div class="row between"><span class="eyebrow">Expenses</span><span class="small muted">Check Fee if the Rec Center fee pays it, not dues</span></div>${(lines||[]).map(l=>`<div class="expline${l.fee?' isfee':''}"><input type="text" id="${kind}l-${esc(pid)}-${esc(l.id)}" data-c="line" data-kind="${kind}" data-id="${esc(pid)}" data-l="${esc(l.id)}" data-k="label" value="${esc(l.label)}" aria-label="Expense" placeholder="Expense"><input type="text" inputmode="decimal" class="money" id="${kind}a-${esc(pid)}-${esc(l.id)}" data-c="line" data-kind="${kind}" data-id="${esc(pid)}" data-l="${esc(l.id)}" data-k="amount" value="${mval(l.amount)}" placeholder="0.00" aria-label="Amount"><label class="feechk" title="Paid from the Rec Center fee, so it is not billed to players"><input type="checkbox" id="${kind}f-${esc(pid)}-${esc(l.id)}" data-c="line" data-kind="${kind}" data-id="${esc(pid)}" data-l="${esc(l.id)}" data-k="fee"${l.fee?' checked':''}>Fee</label><button class="danger" data-act="delline" data-kind="${kind}" data-id="${esc(pid)}" data-l="${esc(l.id)}" aria-label="Remove expense">✕</button>${per?`<span class="per num">${per(l)}</span>`:''}</div>`).join('')}<div><button data-act="addline" data-kind="${kind}" data-id="${esc(pid)}">Add an expense</button></div></div>`;}
function mutLines(kind,pid,fn){
  if(kind==='exp'){const t=local.trips.get(pid);if(!t)return;const lines=clone(Array.isArray(t.expenses)?t.expenses:(+t.cost?[{id:uid(),label:'Trip cost',amount:+t.cost}]:[]));fn(lines);put('trips',pid,{...t,expenses:lines});}
  else setCfg(c=>{const it=(c.fixed||[]).find(i=>i.id===pid);if(!it)return;if(!Array.isArray(it.lines))it.lines=+it.amount?[{id:uid(),label:it.name||'Cost',amount:+it.amount}]:[];fn(it.lines);});
}
function vBalances(C){
  if(!C.list.length) return `<div class="empty"><h2>Start with the roster</h2>
    <ol><li>Add your players and mark each one travel squad or practice squad.</li>
    <li>Enter gear, coach's pay, and the fundraising total.</li>
    <li>Add each trip with its real cost and check off who went. Every balance updates as you go.</li></ol>
    <div><button class="primary" data-act="tab" data-tab="roster">Add players</button></div></div>`;
  const rows=C.list.filter(r=>S.filter==='all'||(S.filter==='owes'?r.balance>0.005:r.balance<=0.005));
  const f=(k,l)=>`<button data-act="filter" data-f="${k}" aria-pressed="${S.filter===k}">${l}</button>`;
  return `${warns(C)}
  <div class="row between"><div class="filters">${f('all','All')}${f('owes','Owes')}${f('clear','Settled')}</div>
  <button data-act="copy">Copy balances</button></div>
  <div class="scroll"><table><thead><tr><th>Player</th><th class="l">Squad</th><th>Squad &amp; league</th><th>Travel</th><th>Fundraising</th><th>Dues</th><th>Paid</th><th>Balance</th><th class="l">Status</th></tr></thead>
  <tbody>${rows.map(r=>`<tr><td><button class="pname" data-act="open" data-id="${esc(r.id)}" aria-expanded="${!!S.open[r.id]}">${esc(r.name)}</button>${r.ownFund?' <span class="tag ps" title="His fundraising goes only to his own dues">Own fundraising</span>':''}</td>
    <td class="l">${squadTag(r.squad)}</td><td class="num">${fmt(r.fixed)}</td><td class="num">${fmt(r.travel)} <span class="muted small">(${r.tripCount})</span></td>
    <td class="num">${r.credit?fmt(-r.credit):fmt(0)}</td><td class="num">${fmt(r.net)}</td><td class="num">${fmt(r.paid)}</td><td class="num bal">${fmt(r.balance)}</td><td class="l">${pill(r)}</td></tr>
    ${S.open[r.id]?detail(r):''}`).join('')||'<tr><td colspan="9" class="muted">No players match this filter.</td></tr>'}</tbody>
  <tfoot><tr><td>Total</td><td></td><td class="num">${fmt(C.tot.fixed)}</td><td class="num">${fmt(C.tot.travel)}</td><td class="num">${fmt(-C.tot.credit)}</td><td class="num">${fmt(C.tot.net)}</td><td class="num">${fmt(C.tot.paid)}</td><td class="num">${fmt(C.tot.net-C.tot.paid)}</td><td></td></tr></tfoot></table></div>
  <p class="small muted">Dues = gear, coach's pay, and USCCS costs (travel squad only) + a share of each trip taken − fundraising credit. The number beside Travel is trips taken.</p>`;
}
function detail(r){
  const pays=[...local.payments].filter(([id,p])=>p.playerId===r.id).sort((a,b)=>(b[1].date||'').localeCompare(a[1].date||''));
  return `<tr class="detail"><td colspan="9"><div class="detailgrid">
  <div><span class="eyebrow">How the dues add up</span><div class="lines">
    ${r.items.map(i=>`<span>${esc(i.label)}</span><span class="num">${fmt(i.amount)}</span>`).join('')||'<span class="muted">No charges yet</span><span></span>'}
    ${r.skipped.length?`<span class="muted">Not charged: ${esc(r.skipped.join(', '))}</span><span></span>`:''}
    ${r.credit?`<span>Fundraising credit${r.ownFund?' (his own fundraising only)':''}</span><span class="num">${fmt(-r.credit)}</span>`:''}

const AUTOFROM={trips:'Trips tab',costs:'Costs & fundraising tab',usccs:'USCCS costs tab',payments:'Payments tab',fund:'Costs & fundraising tab'};

function ledAuto(){
  const out=[],c=cfg(),nT=[...local.players.values()].filter(p=>p.squad!=='practice').length;
  local.trips.forEach((t,tid)=>{const ls=Array.isArray(t.expenses)?t.expenses:(+t.cost?[{id:'legacy',label:'Trip cost',amount:+t.cost}]:[]);
    ls.forEach(l=>{const a=Math.max(0,+l.amount||0);if(!a)return;out.push({key:'t-'+tid+'-'+l.id,auto:'trips',type:'exp',amount:a,desc:(t.name||'Trip')+': '+(l.label||'Expense'),date:t.date||l.date||'',category:travelCat(l.label),source:l.fee?'fee':'none'});});});
  (c.fixed||[]).forEach(it=>{const ls=Array.isArray(it.lines)?it.lines:(+it.amount?[{id:'legacy',label:it.name,amount:+it.amount}]:[]);
    const nP=[...local.players].filter(([pid,p])=>p.squad!=='practice'&&!(it.skip||[]).includes(pid)).length;
    ls.forEach(l=>{let a=Math.max(0,+l.amount||0);if(!a)return;if(it.basis==='each')a=Math.round(a*nP*100)/100;if(!a)return;
      out.push({key:'f-'+it.id+'-'+l.id,auto:it.id==='usccs'?'usccs':'costs',type:'exp',amount:a,desc:(it.name||'Squad cost')+': '+(l.label||'Expense')+(it.basis==='each'?` (${nP} players)`:''),date:l.date||'',category:fixedCat(it),source:l.fee?'fee':'none'});});});
  local.payments.forEach((p,pid)=>{const a=Math.max(0,+p.amount||0);if(!a)return;const pl=local.players.get(p.playerId);
    out.push({key:'p-'+pid,auto:'payments',type:'rev',amount:a,desc:'06389-'+(pl?pl.name:'Removed player'),date:p.date||'',category:'Member Dues',source:'dues',notes:p.note||''});});

function ledMatchDates(){
  const L=ledCalc(),ck=e=>(+e.amount).toFixed(2),by=(arr)=>{const m=new Map();arr.forEach(e=>{const k=ck(e);m.set(k,[...(m.get(k)||[]),e]);});return m;};

  const res={matched:[],ambiguous:[],none:[]};
  au.forEach(e=>{const ms=man.get(ck(e))||[];
    if(!ms.length){res.none.push(e);return;}
    if(ms.length>1||aum.get(ck(e)).length>1){res.ambiguous.push(e);return;}
    const m=ms[0];if(!m.date){res.none.push(e);return;}
    res.matched.push({desc:e.desc,amount:e.amount,from:e.date,to:m.date,src:m.desc});
    if(m.date!==e.date){const o={...(local.config.get(e.id)||{}),date:m.date};put('config',e.id,o,0);}
  });
  return res;
}

function ledKey(e){return [e.date,(e.category||'').trim().toLowerCase(),(e.desc||'').trim().toLowerCase(),e.type,(+e.amount).toFixed(2),String(e.po||'').trim()].join('|');}
function ledImport(text){
  const have=new Set(ledEntries().map(ledKey));let n=0,dup=0,skip=0,seq=Date.now();
  text.split(/\r?\n/).forEach(line=>{
    const c=line.split('\t').map(x=>x.trim());if(!c.join(''))return;
    if(/^(date|totals?)$/i.test(c[0])){skip++;return;}
    const rev=pmoney(c[3]),exp=pmoney(c[8]);if(!rev&&!exp){skip++;return;}
    const type=rev?'rev':'exp',amount=rev||exp;
    const source=type==='rev'?(pmoney(c[4])?'fund':pmoney(c[5])?'dues':pmoney(c[7])?'univ':'none'):(pmoney(c[6])?'fee':'none');
    const e={date:parseDate(c[0]),category:(c[1]||'').slice(0,60),desc:(c[2]||'').slice(0,160),type,amount,source,period:(c[10]||'').slice(0,20),po:(c[11]||'').slice(0,40),method:(c[12]||'').slice(0,40),notes:(c[13]||'').slice(0,200),seq:seq++};
    const k=ledKey(e);if(have.has(k)){dup++;return;}have.add(k);put('config','led-'+uid(),e,0);n++;
  });
  return {n,dup,skip};
}


/* ---------- budget tracker ---------- */
const TSUBS=['Lodging','Airfare','Rental cars/gas'];
function travelSub(cat){const c=(cat||'').trim().toLowerCase();
  if(!/^(travel|lodging|airfare|flights?|rental|gas|fuel)/.test(c))return null;
  return /lodg|hotel|airbnb/.test(c)?'Lodging':/air|flight/.test(c)?'Airfare':/\bmp\b|-mp|motor|rental|car|van|gas|fuel|sedan/.test(c)?'Rental cars/gas':'Other travel';}
function budgetGroups(es,type){
  const m=new Map(),tsub=new Map();es.filter(e=>(type==='exp')===(e.type==='exp')).forEach(e=>{let k=(e.category||'').trim()||'Uncategorized';
    if(type==='exp'){const sub=travelSub(k);if(sub){k='Travel';tsub.set(sub,(tsub.get(sub)||0)+(+e.amount||0));}}
    m.set(k,(m.get(k)||0)+(+e.amount||0));});
  let arr=[...m].map(([name,v])=>({name,v})).filter(x=>x.v>0.004).sort((a,b)=>b.v-a.v);
  const total=arr.reduce((t,x)=>t+x.v,0);
  if(arr.length>6){const rest=arr.slice(5);arr=[...arr.slice(0,5),{name:'Other',v:rest.reduce((t,x)=>t+x.v,0),other:true,n:rest.length,names:rest.map(x=>x.name)}];}
  const hasT=type==='exp'&&arr.some(x=>x.name==='Travel'&&!x.other);
  const named=arr.filter(x=>!x.other&&!(hasT&&x.name==='Travel')).map(x=>x.name).sort((a,b)=>a.localeCompare(b));
  arr.forEach(x=>{x.color=x.other?'var(--c-other)':(hasT&&x.name==='Travel')?'var(--c1)':`var(--c${named.indexOf(x.name)+(hasT?2:1)})`;x.pct=total?x.v/total:0;
    if(hasT&&x.name==='Travel'&&tsub.size){x.subs=[...TSUBS,...(tsub.get('Other travel')?['Other travel']:[])].map((n,j)=>({name:n,v:tsub.get(n)||0,pct:x.v?(tsub.get(n)||0)/x.v:0,color:`var(--t${j+1})`}));}});
  return {arr,total};
}
function donutSvg(kind,g){
  const R=84,r=56,cx=90,cy=90;
  if(!g.total)return `<svg viewBox="0 0 180 180" class="donut" role="img" aria-label="No ${kind==='exp'?'spending':'income'} yet"><circle cx="90" cy="90" r="70" fill="none" stroke="var(--line)" stroke-width="28"/></svg>`;
  let a0=-Math.PI/2;const pt=(rad,a)=>`${(cx+rad*Math.cos(a)).toFixed(2)} ${(cy+rad*Math.sin(a)).toFixed(2)}`;
  const flat=[];g.arr.forEach((x,i)=>{const subs=(x.subs||[]).filter(u=>u.v>0.004);
    if(subs.length)x.subs.forEach((u,j)=>{if(u.v>0.004)flat.push({key:`${kind}-${i}-${j}`,color:u.color,frac:u.v/g.total,title:`${x.name}: ${u.name} ${fmt(u.v)} (${Math.round(u.pct*100)}% of travel)`});});
    else flat.push({key:`${kind}-${i}`,color:x.color,frac:x.pct,title:`${x.name}: ${fmt(x.v)} (${Math.round(x.pct*100)}%)`});});
  const segs=flat.map(x=>{
    if(flat.length===1)return `<path data-bseg="${x.key}" d="M ${cx} ${cy-R} A ${R} ${R} 0 1 1 ${cx-0.01} ${cy-R} L ${cx-0.01} ${cy-r} A ${r} ${r} 0 1 0 ${cx} ${cy-r} Z" fill="${x.color}" stroke="var(--surface)" stroke-width="2"><title>${esc(x.title)}</title></path>`;
    const a1=a0+x.frac*2*Math.PI,lg=a1-a0>Math.PI?1:0;
    const d=`M ${pt(R,a0)} A ${R} ${R} 0 ${lg} 1 ${pt(R,a1)} L ${pt(r,a1)} A ${r} ${r} 0 ${lg} 0 ${pt(r,a0)} Z`;a0=a1;
    return `<path data-bseg="${x.key}" d="${d}" fill="${x.color}" stroke="var(--surface)" stroke-width="2"><title>${esc(x.title)}</title></path>`;}).join('');
  return `<svg viewBox="0 0 180 180" class="donut" role="img" aria-label="${kind==='exp'?'Spending':'Income'} by category">${segs}</svg>`;
}
function budgetPanel(kind,g){
  const lbl=kind==='exp'?'Spending':'Income';

function vBudget(L){

document.addEventListener('keydown',e=>{const el=e.target;if(e.key!=='Enter')return;if(el.dataset&&el.dataset.npd){e.preventDefault();npCommitDate(el);}else if(el.id&&el.id.startsWith('npadd-')){e.preventDefault();ACT.npadd({ph:el.id.slice(6)});}});

/* ---------- actions ---------- */
function setCfg(mut){const c=clone(cfg());mut(c);put('config','main',c);}
function addPayment(pid,amt,date,note){
  if(!local.players.has(pid)) return toast('Pick a player first.');
  if(!amt) return toast('Enter a payment amount greater than zero.');
  put('payments',uid(),{playerId:pid,amount:amt,date:date||today(),note:(note||'').slice(0,200),at:Date.now()},0);toast('Payment recorded');return true;
}
const clearEls=(...ids)=>ids.forEach(i=>{const e=$(i);if(e)e.value='';});
const ACT={
  tab(d){S.tab=d.tab;S.armed=null;try{history.replaceState(null,'','#'+d.tab);}catch(e){}render();},
  filter(d){S.filter=d.f;render();},
  lock(){lock('');},
  open(d){S.open[d.id]=!S.open[d.id];render();},
  arm(d){S.armed=d.key;render();}, disarm(){S.armed=null;render();},
  addplayers(){
    const names=$('np-names').value.split(/\r?\n/).map(s=>s.trim().slice(0,80)).filter(Boolean),squad=$('np-squad').value;
    if(!names.length) return toast('Type at least one name.');
    names.forEach(n=>put('players',uid(),{name:n,squad},0));clearEls('np-names');toast(names.length+(names.length===1?' player added':' players added'));
  },
  delplayer(d){S.armed=null;del('players',d.id);},
  addtrip(){
    const name=$('nt-name').value.trim().slice(0,80);if(!name) return toast('Give the trip a name.');
    put('trips',uid(),{name,date:$('nt-date').value||'',expenses:[{id:uid(),label:'Vans',amount:0},{id:uid(),label:'Gas',amount:0},{id:uid(),label:'AirBnB/hotel',amount:0}],travelers:[]},0);clearEls('nt-name','nt-date');
  },
  deltrip(d){S.armed=null;del('trips',d.id);},
  alltravel(d){const t=local.trips.get(d.id);if(!t)return;const s=new Set(t.travelers||[]);local.players.forEach((p,id)=>{if(p.squad!=='practice')s.add(id);});put('trips',d.id,{...t,travelers:[...s]});},
  toggletrip(d){const t=local.trips.get(d.id);if(!t)return;const s=new Set(t.travelers||[]);s.has(d.p)?s.delete(d.p):s.add(d.p);put('trips',d.id,{...t,travelers:[...s]},500);},
  clearall(d){const t=local.trips.get(d.id);if(t)put('trips',d.id,{...t,travelers:[]});},
  addfixed(){setCfg(c=>{c.fixed=c.fixed||[];c.fixed.push({id:uid(),name:'New category',basis:'split',lines:[{id:uid(),label:'',amount:0}]});});},
  delfixed(d){setCfg(c=>{c.fixed=(c.fixed||[]).filter(i=>i.id!==d.id);});},
  addline(d){mutLines(d.kind,d.id,ls=>ls.push({id:uid(),label:'',amount:0}));},
  delline(d){mutLines(d.kind,d.id,ls=>{const i=ls.findIndex(l=>l.id===d.l);if(i>=0)ls.splice(i,1);else if(d.l==='legacy')ls.length=0;});},
  lmatch(){S.lmatch=ledMatchDates();toast(S.lmatch.matched.length+' dates matched');render();},
  lmatchclose(){S.lmatch=null;render();},
  npadd(d){const el=$('npadd-'+d.ph);const title=(el&&el.value||'').trim().slice(0,140);if(!title)return toast('Type a task first.');
    const id='c-'+Date.now().toString(36);put('config','np-'+id,{phase:d.ph,title,desc:'',start:today(),deadline:'',owner:'',status:'none',notes:'',custom:true},0);el.value='';toast('Task added');},
  nplink(d){S.nplink=d.id;render();setTimeout(()=>{const el=$('npl-u-'+d.id);if(el)el.focus();},40);},
  nplinkoff(){S.nplink=null;render();},
  npsavelink(d){let u=($('npl-u-'+d.id).value||'').trim(),t=($('npl-t-'+d.id).value||'').trim().slice(0,80);
    if(u&&!/^https?:\/\//i.test(u))u='https://'+u;
    let ok=false;try{const x=new URL(u);ok=/^https?:$/.test(x.protocol)&&x.hostname.includes('.');}catch(e){}
    if(!ok)return toast('Enter a full link, like https://docs.google.com/…');
    npSave(d.id,{link:{t:t||'Open link',u:u.slice(0,600)}});S.nplink=null;toast('Link saved');},
  npdellink(d){npSave(d.id,{link:{t:'',u:''}});S.nplink=null;toast('Link removed');},
  npcopy(d){const v=d.v;try{navigator.clipboard.writeText(v).then(()=>toast('Email copied'),()=>toast('Copying is blocked here. Select the address to copy it.'));}catch(e){toast('Copying is blocked here. Select the address to copy it.');}},
  npdel(d){S.armed=null;del('config','np-'+d.id);},
  payopen(d){S.payOpen=S.payOpen||{};S.payOpen[d.id]=!S.payOpen[d.id];render();},
  ownadd(){const id=$('own-add').value;if(!id)return toast('Choose a player first.');const p=local.players.get(id);if(!p)return;put('players',id,{...p,ownFund:true},0);$('own-add').value='';},
  limp(){S.limp=!S.limp;render();},
  lfilter(d){S.lfilter=d.f;render();},
  lopen(d){S.lopen=S.lopen||{};S.lopen[d.id]=!S.lopen[d.id];render();},
  ldel(d){S.armed=null;del('config',d.id);},
  limport(){const t=$('li-text').value;if(!t.trim())return toast('Paste the rows first.');const r=ledImport(t);clearEls('li-text');if(r.n)S.limp=false;toast(`Imported ${r.n} ${r.n===1?'entry':'entries'}`+(r.dup?`, skipped ${r.dup} already in the ledger`:'')+'.');render();},
  laddentry(){
    const amt=money($('nl-amt').value);if(!amt)return toast('Enter an amount greater than zero.');
    const desc=$('nl-desc').value.trim();if(!desc)return toast('Add a description.');
    const g=i=>$(i).value.trim();
    put('config','led-'+uid(),{date:g('nl-date'),type:$('nl-type').value==='rev'?'rev':'exp',category:g('nl-cat').slice(0,60),desc:desc.slice(0,160),amount:amt,source:$('nl-src').value,period:g('nl-per').slice(0,20),po:g('nl-po').slice(0,40),method:g('nl-meth').slice(0,40),notes:g('nl-notes').slice(0,200),seq:Date.now()},0);
    clearEls('nl-cat','nl-desc','nl-amt','nl-per','nl-po','nl-meth','nl-notes');toast('Entry added');
  },
  lcopy(){
    const L=ledCalc(),n=v=>v?(+v).toFixed(2):'';
    const txt=[['Date','Category','Description','Revenue','Fundraised Funds-08001','Member Dues 06389','Fee Spending','University Funding','Expense','Balance','Period','PO#','NOTES',''].join('\t'),
      ...L.es.map(e=>{const r=e.type!=='exp'?e.amount:0,x=e.type==='exp'?e.amount:0;return [usDate(e.date),e.category||'',e.desc||'',n(r),e.source==='fund'?n(r):'',e.source==='dues'?n(r):'',e.source==='fee'?n(x):'',e.source==='univ'?n(r):'',n(x),(+e.bal).toFixed(2),e.period||'',e.po||'',e.method||'',e.notes||''].join('\t');})].join('\n');
    const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('aria-label','Ledger');$('view').prepend(ta);ta.select();toast('Copying is blocked here. The ledger is selected at the top for you to copy.');};
    try{navigator.clipboard.writeText(txt).then(()=>toast('Ledger copied. Paste it into a spreadsheet.'),fb);}catch(e){fb();}
  },
  addpay(){if(addPayment($('pp-player').value,money($('pp-amt').value),$('pp-date').value,$('pp-note').value))clearEls('pp-amt','pp-note');},
  quickpay(d){if(addPayment(d.id,money($('qa-'+d.id).value),$('qd-'+d.id).value,$('qn-'+d.id).value))clearEls('qa-'+d.id,'qn-'+d.id);},
  payfull(d){const C=compute(local.players,local.trips,local.payments,cfg()),r=C.rows.get(d.id),el=$('qa-'+d.id);if(r&&el){el.value=(Math.round(r.balance*100)/100).toFixed(2);el.focus();}},
  delpay(d){S.armed=null;del('payments',d.id);},
  copy(){
    const C=compute(local.players,local.trips,local.payments,cfg());
    const txt=['Player\tSquad\tDues\tPaid\tBalance',...C.list.map(r=>[r.name,r.squad,fmt(r.net),fmt(r.paid),fmt(r.balance)].join('\t'))].join('\n');
    const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('aria-label','Balances');$('view').prepend(ta);ta.select();toast('Copying is blocked here. The balances are selected at the top for you to copy.');};
    try{navigator.clipboard.writeText(txt).then(()=>toast('Balances copied'),fb);}catch(e){fb();}
  }
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&ACT[b.dataset.act])ACT[b.dataset.act](b.dataset);});
document.addEventListener('change',e=>{
  const el=e.target,d=el.dataset;if(!d.c)return;
  if(d.c==='trip'){const t=local.trips.get(d.id);if(!t)return;put('trips',d.id,{...t,[d.k]:d.k==='cost'?money(el.value):el.value.trim().slice(0,80)});}
  else if(d.c==='line'){mutLines(d.kind,d.id,ls=>{const l=ls.find(x=>x.id===d.l)||(d.l==='legacy'?ls[0]:null);if(l){if(d.k==='fee'){l.fee=el.checked;return;}l[d.k]=d.k==='amount'?money(el.value):el.value.trim().slice(0,60);if(d.k==='amount'&&l.amount&&!l.date)l.date=today();}});}
  else if(d.c==='trav'){const t=local.trips.get(d.id);if(!t)return;const s=new Set(t.travelers||[]);el.checked?s.add(d.p):s.delete(d.p);put('trips',d.id,{...t,travelers:[...s]},500);}
  else if(d.c==='player'){const p=local.players.get(d.id);if(!p)return;const v=d.k==='name'?(el.value.trim().slice(0,80)||p.name):el.value;put('players',d.id,{...p,[d.k]:v});}
  else if(d.c==='fixed'){setCfg(c=>{const it=(c.fixed||[]).find(i=>i.id===d.id);if(it)it[d.k]=d.k==='amount'?money(el.value):d.k==='name'?el.value.trim().slice(0,60):el.value;});}
  else if(d.c==='fund'){setCfg(c=>{c.fundraising=money(el.value);c.fundraisingDate=today();});}
  else if(d.c==='roll'){setCfg(c=>{c.rollover=el.checked;});}
  else if(d.c==='fmode'){setCfg(c=>{c.fundMode=el.value==='qualified'?'qualified':'all';});}
  else if(d.c==='ltype'){S.ltype=el.value==='rev'?'rev':'exp';render();}
  else if(d.c==='lset'){const s={...ledSet()};s[d.k]=d.k==='foundation'?money(el.value):el.value.trim().slice(0,60);put('config','ledgerset',s);}
  else if(d.c==='np'){const v=d.k==='notes'?el.value.slice(0,500):d.k==='status'?(el.value in NPST?el.value:'none'):el.value.trim().slice(0,80);npSave(d.id,{[d.k]:v});}
  else if(d.c==='lov'){const o={...(local.config.get(d.id)||{})};o[d.k]=el.value.trim().slice(0,d.k==='notes'?200:60);put('config',d.id,o);}
  else if(d.c==='led'){const e=local.config.get(d.id);if(!e)return;const n={...e};
    if(d.k==='amount'){const a=money(el.value);if(!a){toast('Enter an amount greater than zero.');render();return;}n.amount=a;}
    else if(d.k==='type'){n.type=el.value==='rev'?'rev':'exp';if(!FUNDS[n.type].some(([k])=>k===n.source))n.source='none';}
    else n[d.k]=el.value.trim().slice(0,d.k==='notes'?200:160);
    put('config',d.id,n);}
  else if(d.c==='feestart'){setCfg(c=>{c.feeStart=money(el.value);});}
  else if(d.c==='skip'){setCfg(c=>{const it=(c.fixed||[]).find(i=>i.id===d.id);if(!it)return;const sk=new Set(it.skip||[]);el.checked?sk.delete(d.p):sk.add(d.p);it.skip=[...sk];});}
  else if(d.c==='own'){const p=local.players.get(d.p);if(p)put('players',d.p,{...p,ownFund:el.checked},0);}
  else if(d.c==='ownamt'){const p=local.players.get(d.p);if(p)put('players',d.p,{...p,ownAmt:money(el.value)});}
  else if(d.c==='qual'){const p=local.players.get(d.p);if(p)put('players',d.p,{...p,fundQualified:el.checked},0);}
});
const ldT={};
function commitLDate(el){
  clearTimeout(ldT[el.id]);const id=el.dataset.ld,v=el.value;
  if(v&&!/^(19|20)\d\d-\d\d-\d\d$/.test(v))return;
  const cur=local.config.get(id)||{};
  if(id.startsWith('lov-')){if((cur.date||'')===v)return;}
  else{if(!local.config.has(id)||(cur.date||'')===v)return;}
  put('config',id,{...cur,date:v},0);S.lflash=id;
}
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.ld){clearTimeout(ldT[el.id]);ldT[el.id]=setTimeout(()=>commitLDate(el),1200);}});
document.addEventListener('focusout',e=>{const el=e.target;if(el.dataset&&el.dataset.ld)commitLDate(el);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.ld){e.preventDefault();commitLDate(e.target);}});
document.addEventListener('submit',e=>{if(e.target.id==='lockform'){e.preventDefault();const v=$('lockcode').value.trim();if(v){S.lockMsg='';unlock(v);}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input[type=text]')&&e.target.dataset.c)e.target.blur();});
try{const h=location.hash.slice(1);if(['balances','trips','roster','costs','usccs','payments','ledger','nationals'].includes(h))S.tab=h;}catch(e){}
setStatus();render();boot();
</script>
